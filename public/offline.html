<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1e3a8a">
    <title>Cabinet Tayba — Hors connexion</title>
    <style>
        body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8fafc;color:#0f172a;font-family:Arial,sans-serif}
        main{max-width:32rem;margin:1rem;padding:2rem;text-align:center;background:#fff;border:1px solid #e2e8f0;border-radius:1rem;box-shadow:0 10px 25px rgba(15,23,42,.08)}
        img{width:88px;height:88px}h1{color:#1e3a8a}button{border:0;border-radius:.65rem;background:#1e3a8a;color:#fff;padding:.8rem 1.2rem;font-weight:700}
    </style>
</head>
<body>
<main>
    <img src="/icons/pwa-logo-192.png" alt="Cabinet Tayba">
    <h1>Connexion indisponible</h1>
    <p>Vérifiez votre connexion Internet puis réessayez. Les rendez-vous ne sont jamais modifiés hors connexion.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
</main>
</body>
</html>
